<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Editar</title>
</head>
<body>
<header>
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            <div class="flash-messages">
                {% for category, message in messages %}
                    <div class="flash {{ category }}">{{ message }}</div>
                {% endfor %}
            </div>
        {% endif %}
    {% endwith %}
</header>


    <main>
        <h2>Adicionar livro</h2>
        <form action="{{ url_for('editar', id=livro[0]) }}" method="post">
            <label for="titulo">Título:</label>
            <input type="text" name="titulo" id="titulo" value="{{ livro[1] }}">


            <label for="autor">Autor:</label>
            <input type="text" name="autor" id="autor" value="{{ livro[2] }}">


            <label for="ano_publicacao">Ano de publicação:</label>
            <input type="number" name="ano_publicacao" id="ano_publicacao" value="{{ livro[3] }}">

            <button type="submit" class="btn">Salvar</button>
        </form>
    </main>


</body>
</html>
