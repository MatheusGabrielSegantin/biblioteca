<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Novo</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/novo.css') }}">
</head>
<body>
<header>
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            <div class="flash-messages">
                {% for category, message in messages %}
                    <div class="flash {{ category }}">{{ message }}</div>
                {% endfor %}
            </div>
        {% endif %}
    {% endwith %}
</header>


    <main>
        <h2>Adicionar livro</h2>
        <form action="/criar" method="post" enctype="multipart/form-data">

            <label for="imagem">Capa do Livro:</label>
            <input type="file" name="imagem" id="imagem" accept=".jpg">

            <label for="titulo">Título:</label>
            <input type="text" name="titulo" id="titulo">


            <label for="autor">Autor:</label>
            <input type="text" name="autor" id="autor">


            <label for="ano_publicacao">Ano de publicação:</label>
            <input type="number" name="ano_publicacao" id="ano_publicacao">

            <button type="submit" class="btn">Salvar</button>
        </form>
    </main>


</body>
</html>
